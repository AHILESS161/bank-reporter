[project]
name = "bank-reporter-api"
version = "0.1.0"
description = "Local banking correspondent agent"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy==2.0.43",
  "psycopg[binary]==3.2.9",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  "beautifulsoup4==4.13.4",
  "lxml==6.0.1",
  "trafilatura==2.0.0",
  "openai==1.102.0",
  "celery[redis]==5.5.3",
  "redis==5.2.1",
  "pymupdf==1.26.4",
  "pdfplumber==0.11.7",
  "pytesseract==0.3.13",
  "pillow==11.3.0",
  "openpyxl==3.1.5",
  "polars==1.32.3",
  "dbfread==2.0.7",
  "charset-normalizer==3.4.3",
  "python-dateutil==2.9.0.post0",
  "icalendar==6.3.1",
  "jinja2==3.1.6",
  "tenacity==9.1.2"
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "respx==0.22.0",
  "ruff==0.12.11"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=tests/.runtime/pytest"

[tool.ruff]
line-length = 110
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
