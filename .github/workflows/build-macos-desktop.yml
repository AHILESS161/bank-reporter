name: Build macOS Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json
            services/browser/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Build DMG
        run: bash scripts/build-macos-desktop.sh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Bank-Reporter-macOS-arm64
          path: apps/desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Bank-Reporter-macOS-*
          path: dist
          merge-multiple: true
      - name: Publish desktop release
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg --generate-notes --title "Bank Reporter $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
